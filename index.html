*{box-sizing:border-box;}

html,body{
margin:0;
overflow-x:hidden;
overflow-y:hidden;

background-image:url("paper.jpg");

html.scroll-open,

.contents{
position:relative;

height:100%;

.inner{

width:100%;

/* section 1 */
.scene{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:url("background1.png") center / cover no-repeat;
}

.play-text{
position:absolute;
left:50%;
top:42vh;
transform:translateX(-50%);
z-index:20;
font-family:'YunChorokwoosanEoriniMinguk';
font-size:64px;
color:black;
white-space:nowrap;
opacity:0;
animation:
fadeInText 1.8s cubic-bezier(.22,.61,.36,1) forwards,
textFloat 3.5s ease-in-out 11s infinite;
animation-delay:9.2s;
}

@keyframes fadeInText{
0%{opacity:0; transform:translateX(-50%) translateY(45px) scale(.97);}
100%{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}
}

@keyframes textFloat{
0%,100%{transform:translateX(-50%) translateY(0);}
50%{transform:translateX(-50%) translateY(-6px);}
}

.balloon-stage,
.cloud-stage{
position:absolute;
inset:0;
overflow:hidden;
}

.balloon{
position:absolute;
width:190px;
bottom:-520px;
transform:translateX(-50%);
pointer-events:none;
will-change:transform;
}

.balloon.back{width:190px; opacity:.85;}
.balloon.front{width:200px;}

@keyframes floatUpWithPause{
0%{transform:translateX(-50%) translateY(0);}
70%{transform:translateX(-50%) translateY(-88vh);}
88%{transform:translateX(-50%) translateY(-110vh);}
100%{transform:translateX(-50%) translateY(-170vh);}
}

.cloud{
position:absolute;
left:-650px;
width:600px;
pointer-events:none;
will-change:transform;
}

.cloud.cloud2{left:-650px;}

@keyframes cloudMove{
0%{transform:translateX(0);}
100%{transform:translateX(210vw);}
}

@keyframes cloudStop{
0%{transform:translateX(0);}
72%{transform:translateX(calc(50vw + 350px));}
100%{transform:translateX(calc(50vw + 350px));}
}

/* section 2 */

width:100vw;
height:100vh;
overflow:hidden;
background:transparent;
font-family:'YunChorokwoosanEoriniMinguk';

.drop{

}

60%{opacity:1; transform:translateY(25px) rotate(3deg);}
78%{transform:translateY(-8px) rotate(-2deg);}
100%{opacity:1; transform:translateY(0) rotate(0);}

@keyframes pulseDrop{

50%{transform:scale(1.04);}
}

<script>
history.scrollRestoration = "manual";

const balloonStage = document.getElementById("balloonStage");
const cloudStage = document.getElementById("cloudStage");
const rainScene = document.getElementById("rainScene");
const heroDrop = document.querySelector(".r7");
const nextScene = document.getElementById("nextScene");
const scene4 = document.getElementById("scene4");
const scene5 = document.getElementById("scene5");
const scene6 = document.querySelector(".scene6");
const scene7 = document.querySelector(".scene7");
const scene8 = document.querySelector(".scene8");

const foot1 = document.querySelector(".foot1");
const foot2 = document.querySelector(".foot2");
const foot3 = document.querySelector(".foot3");
const foot4 = document.querySelector(".foot4");
const foot5 = document.querySelector(".foot5");
const foot6 = document.querySelector(".foot6");

const panicText = document.querySelector(".s6-t4");

window.addEventListener("scroll", () => {

  const rect5 = scene5.getBoundingClientRect();

  if(
    scene5.classList.contains("open") &&
    rect5.top < window.innerHeight * 0.2
  ){
    scene6.classList.add("open");
  }

  const s6Rect = scene6.getBoundingClientRect();

  if(s6Rect.top < window.innerHeight * 0.8){
    foot1.classList.add("show");
  }else{
    foot1.classList.remove("show");
  }

  if(s6Rect.top < -900){
    foot1.classList.remove("show");
    foot2.classList.add("show");
  }else{
    foot2.classList.remove("show");
  }

  if(s6Rect.top < -1800){
    foot2.classList.remove("show");
    foot3.classList.add("show");
  }else{
    foot3.classList.remove("show");
  }

  if(s6Rect.top < -2700){
    foot3.classList.remove("show");
    foot4.classList.add("show");
  }else{
    foot4.classList.remove("show");
  }

  if(s6Rect.top < -3800){
    foot4.classList.remove("show");
    foot5.classList.add("show");
    foot6.classList.add("show");
    panicText.classList.add("panic");
  }else{
    foot5.classList.remove("show");
    foot6.classList.remove("show");
    panicText.classList.remove("panic");
  }

  if(s6Rect.top < -4200){
    scene7.classList.add("open");
  }

  const rect7 = scene7.getBoundingClientRect();

  if(rect7.top < window.innerHeight * 0.7){
    scene8.classList.add("open");
  }

});

function createBalloon(item){
const img = document.createElement("img");
img.src = item.src;
img.className = `balloon ${item.layer}`;
img.style.left = `${item.left}px`;
img.style.animation = `floatUpWithPause ${item.duration}s ease-in-out ${item.delay}s forwards`;
balloonStage.appendChild(img);
img.addEventListener("animationend", () => img.remove());
}

balloonLayout.forEach(createBalloon);

function createCloud(src, top, delay, speed, stop=false){
const img = document.createElement("img");
img.src = src;
img.className = stop ? "cloud cloud2" : "cloud";
img.style.top = top;
const animationName = stop ? "cloudStop" : "cloudMove";
const easing = stop ? "ease-out" : "linear";
img.style.animation = `${animationName} ${speed}s ${easing} ${delay}s forwards`;
cloudStage.appendChild(img);
}

function startRainAnimation(){
const rect = rainScene.getBoundingClientRect();
if(rect.top < window.innerHeight * 0.8){
rainScene.classList.add("active");
window.removeEventListener("scroll", startRainAnimation);
}
}

window.addEventListener("scroll", startRainAnimation);

heroDrop.addEventListener("click", () => {

  rainScene.classList.add("move-on");

  nextScene.classList.add("open");
  scene4.classList.add("open");
  scene5.classList.add("open");

  // 현재 위치 저장
  const startRect = heroDrop.getBoundingClientRect();

heroDrop.style.position = "fixed";

heroDrop.style.animation = "none";
heroDrop.style.animationFillMode = "forwards";

heroDrop.style.transform = "none";

heroDrop.style.opacity = "1";

  heroDrop.style.left = startRect.left + "px";
  heroDrop.style.top = startRect.top + "px";

  heroDrop.style.margin = "0";

  heroDrop.style.zIndex = "9999";

  // section3 먼저 이동
  nextScene.querySelector(".contents").appendChild(heroDrop);

  // section3 스크롤
  nextScene.scrollIntoView({
    behavior:"smooth"
  });

  // 목표 위치
  setTimeout(() => {

    const target =
      document.querySelector(".drop-target");

    const targetRect =
      target.getBoundingClientRect();

    heroDrop.style.left =
      (targetRect.left - heroDrop.offsetWidth/2) + "px";

    heroDrop.style.top =
      (targetRect.top - heroDrop.offsetHeight/2) + "px";

  }, 200);

  // 이동 완료 후 section3 내부에 귀속
  setTimeout(() => {

    heroDrop.style.position = "absolute";

   heroDrop.style.left = "42%";
heroDrop.style.top = "30%";

heroDrop.style.transform =
  "translate(-50%, -58%)";
    heroDrop.style.animation =
      "pulseDrop 2.4s ease-in-out infinite";

  }, 1500);

});
